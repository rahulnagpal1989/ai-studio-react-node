name: Dependencies & Security

on:
  schedule:
    - cron: '0 2 * * 1' # Run every Monday at 2 AM
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Check for outdated packages
        run: |
          echo "Root dependencies:"
          npm outdated || true
          echo "Frontend dependencies:"
          cd frontend && npm outdated || true
          echo "Backend dependencies:"
          cd ../backend && npm outdated || true

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate
          cd frontend && npm audit --audit-level=moderate
          cd ../backend && npm audit --audit-level=moderate

      - name: Create security report
        if: failure()
        run: |
          echo "## Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "Some packages have security vulnerabilities that need attention." >> $GITHUB_STEP_SUMMARY
          echo "Please run \`npm audit fix\` to resolve automatically fixable issues." >> $GITHUB_STEP_SUMMARY

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
